# Builds Worldbuilder.exe on GitHub's Windows machines every time you push.
# Download it from the Actions tab: open the latest run, then "Worldbuilder-windows" under Artifacts.
name: Build Windows exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: Worldbuilder-windows
          path: build/Release/Worldbuilder.exe
